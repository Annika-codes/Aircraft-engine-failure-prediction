data:
  raw_dir: data/raw
  processed_dir: data/processed
  # Column layout of the raw C-MAPSS txt files (space-delimited, no header)
  columns:
    - unit_number
    - time_in_cycles
    - op_setting_1
    - op_setting_2
    - op_setting_3
    - s1
    - s2
    - s3
    - s4
    - s5
    - s6
    - s7
    - s8
    - s9
    - s10
    - s11
    - s12
    - s13
    - s14
    - s15
    - s16
    - s17
    - s18
    - s19
    - s20
    - s21

labels:
  rul_clip: 125

features:
  rolling_windows: [5, 20]
  # sensors known to be ~constant on single-operating-condition subsets
  # (FD001, FD003); auto-detected anyway, this is just a documented default
  low_variance_sensors_fd001: [s1, s5, s6, s10, s16, s18, s19]

model:
  point:
    n_estimators: 300
    max_depth: 5
    learning_rate: 0.05
    subsample: 0.8
    colsample_bytree: 0.8
  quantile:
    lower: 0.1
    upper: 0.9
    n_estimators: 300
    max_depth: 5
    learning_rate: 0.05

dashboard:
  risk_tiers:
    urgent_rul_below: 20
    watch_rul_below: 45
